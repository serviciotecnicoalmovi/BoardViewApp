name: Compilar BoardView

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Solution
    runs-on: windows-latest

    defaults:
      run:
        working-directory: BoardView-1.0.0-alpha.14.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Mostrar información
        run: dotnet --info

      - name: Restaurar paquetes
        run: dotnet restore BoardView.sln

      - name: Compilar
        run: dotnet build BoardView.sln --configuration Release --no-restore
